name: Process scheduled notifications

on:
  schedule:
    # Vercel's Hobby plan only allows daily cron jobs, so scheduled admin
    # notifications are processed from here instead — every 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.agendacapoeiragem.com/api/cron/process-scheduled-notifications
